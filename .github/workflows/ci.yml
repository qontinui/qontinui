name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      # qontinui's pyproject.toml has a path-dep on ../qontinui-schemas
      # (see pyproject.toml: `qontinui-schemas = { path = "../qontinui-schemas", develop = true }`).
      # actions/checkout@v5 refuses `path:` outside the workspace, so clone
      # it via git directly. Pattern mirrors qontinui-web/backend-ci.yml.
      - name: Checkout sibling repo (qontinui-schemas)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git

      - name: Checkout sibling repo (multistate)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/multistate.git

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        id: poetry-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi

      # Rationale: see the tests job. Here the step only keeps the venv this job
      # saves to the shared cache healthy, and the cache is saved only on a miss.
      # ruff never reads site-packages, so a damaged Xlib/ or cv2/ cannot affect it.
      - name: Enforce owners of contested packages (Xlib, cv2)
        if: steps.poetry-cache.outputs.cache-hit != 'true'
        run: poetry run python scripts/enforce_package_owners.py

      - name: Run linting
        run: |
          poetry run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      # qontinui's pyproject.toml has a path-dep on ../qontinui-schemas
      # (see pyproject.toml: `qontinui-schemas = { path = "../qontinui-schemas", develop = true }`).
      # actions/checkout@v5 refuses `path:` outside the workspace, so clone
      # it via git directly. Pattern mirrors qontinui-web/backend-ci.yml.
      - name: Checkout sibling repo (qontinui-schemas)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git

      - name: Checkout sibling repo (multistate)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/multistate.git

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        id: poetry-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi

      # Rationale: see the tests job. Here the step only keeps the venv this job
      # saves to the shared cache healthy, and the cache is saved only on a miss.
      # mypy imports nothing, and Xlib ships no py.typed, so mypy never reads it.
      # It does read cv2's stubs, but this extras-free install's two OpenCV builds
      # ship identical .pyi files. Of the .py files that differ, one is the same
      # size and the other differs by one token, so a race still leaves valid code.
      - name: Enforce owners of contested packages (Xlib, cv2)
        if: steps.poetry-cache.outputs.cache-hit != 'true'
        run: poetry run python scripts/enforce_package_owners.py

      - name: Run type checking
        run: |
          poetry run mypy src/qontinui --ignore-missing-imports

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      # qontinui's pyproject.toml has a path-dep on ../qontinui-schemas
      # (see pyproject.toml: `qontinui-schemas = { path = "../qontinui-schemas", develop = true }`).
      # actions/checkout@v5 refuses `path:` outside the workspace, so clone
      # it via git directly. Pattern mirrors qontinui-web/backend-ci.yml.
      - name: Checkout sibling repo (qontinui-schemas)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git

      - name: Checkout sibling repo (multistate)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/multistate.git

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev
          sudo apt-get install -y xvfb x11-utils
          sudo apt-get install -y libgl1

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          # No extras: the [ml] deps (torch et al.) are optional, so this is
          # the torch-free core lane. Torch-dependent tests self-skip via
          # pytest.importorskip / skip fixtures.
          poetry install --no-interaction --no-ansi

      # Several locked distributions write Xlib/ (python-xlib, python3-xlib) and
      # cv2/ (opencv-python-headless, opencv-python, and opencv-contrib-python
      # under the omniparser extra). Poetry's parallel installer interleaves
      # their writes. A run can then mix whole files from both, giving
      # "module 'Xlib.X' has no attribute 'FamilyServerInterpreted'". Or it can
      # tear one file, giving an IndentationError in Xlib/protocol/__init__.py.
      # Either way every test errors at collection, and a restored venv keeps the
      # damage. Runs on every cache state, here and in tests-ml: these jobs import
      # both packages. This verifies the declared owner's files by RECORD hash and
      # reinstalls the locked owner on a mismatch, so it must follow the install.
      # Why and how: scripts/enforce_package_owners.py.
      - name: Enforce owners of contested packages (Xlib, cv2)
        run: poetry run python scripts/enforce_package_owners.py

      - name: Install Playwright browsers
        run: |
          poetry run playwright install --with-deps chromium

      - name: Run tests with coverage
        run: |
          # Use xvfb-run to provide DISPLAY *and* a per-run ~/.Xauthority.
          # pynput's X backend requires Xauthority to exist; a bare
          # `Xvfb :99 &` + `export DISPLAY=:99` was insufficient and
          # caused every test to ERROR at collection with
          #   ImportError: this platform is not supported:
          #     ~/.Xauthority: [Errno 2] No such file or directory
          # (the cascade through qontinui.__init__ → healing → hal →
          # keyboard_operations → from pynput import keyboard).
          xvfb-run -a poetry run pytest --cov=src/qontinui --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  imagegen:
    # The image provider (docker/imagegen): its licence manifest and recipe tests (plan
    # 2026-10-13-image-generation-and-visual-judgment, Phase 2) and the image facade's tests
    # against a fake pipeline executor (Phase 10) -- no GPU, no weights. Its own project and
    # lock (docker/imagegen/pyproject.toml), on the llama-swap image's interpreter (Ubuntu
    # 22.04 python3, 3.10), because the facade needs FastAPI, which the library's
    # environment does not carry. Fails on a non-admitted licence, an unpinned weight file,
    # drifted vendored code, a runtime lock that disagrees with the manifest, or a facade
    # regression. pytest exits non-zero when it collects nothing; each test is bounded at
    # 60 s (pytest-timeout) and the job at 20 minutes, so a hang fails instead of stalling.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install the imagegen test environment
        run: poetry -C docker/imagegen install --no-interaction --no-ansi

      - name: Run the imagegen tests
        run: poetry -C docker/imagegen run pytest tests -q

  tests-ml:
    # Full suite with the [ml] extra installed — the pre-split CI shape.
    # The core `tests` job proves the torch-free default install; this job
    # proves `-E ml` resolves and runs the torch-dependent tests.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      # Same sibling-repo path-dep as the tests job (see tests job comment).
      - name: Checkout sibling repo (qontinui-schemas)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git

      - name: Checkout sibling repo (multistate)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/multistate.git

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev
          sudo apt-get install -y xvfb x11-utils
          sudo apt-get install -y libgl1

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-ml-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-ml-

      - name: Install dependencies (with ml extra)
        run: |
          # Pulls torch/torchvision from the cu128 index (multi-GB CUDA wheels
          # on a CPU-only runner) because poetry locks a single source per dep;
          # a CPU-wheel CI lane would need a second lock. Cost is unchanged
          # from the pre-split CI, and the poetry cache absorbs repeat runs.
          poetry install --no-interaction --no-ansi --extras ml

      # Rationale: see the tests job.
      - name: Enforce owners of contested packages (Xlib, cv2)
        run: poetry run python scripts/enforce_package_owners.py

      - name: Install Playwright browsers
        run: |
          poetry run playwright install --with-deps chromium

      - name: Run tests
        run: |
          # xvfb-run rationale: see the tests job.
          xvfb-run -a poetry run pytest

  build:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v5

      # Same sibling-repo path-dep as the test job (see test job comment).
      - name: Checkout sibling repo (qontinui-schemas)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git

      - name: Checkout sibling repo (multistate)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/multistate.git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build package
        run: |
          poetry build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*

      - name: Store build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
