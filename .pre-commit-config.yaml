# Vendored model code is pinned byte-for-byte by sha256 (docker/imagegen/manifest.yaml);
# no hook may rewrite it.
exclude: ^docker/imagegen/vendor/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']

  - repo: local
    hooks:
      - id: mypy
        name: Python type check (mypy)
        entry: bash -c 'poetry run mypy -p qontinui'
        language: system
        pass_filenames: false
        files: \.py$
