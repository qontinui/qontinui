# llama-swap configuration for qontinui model orchestration.
#
# Time-shares a single GPU across the vision models (AriaUI, UI-TARS, the
# grounding checkpoints, PaddleOCR, the World-State verifier) and the GGUF LLMs
# served by llama.cpp's llama-server (see "Local LLM candidates" below).
# Only the active model occupies VRAM; idle models unload after TTL.
#
# Models not managed here (they use non-OpenAI APIs):
#   - OmniParser (custom /parse endpoint, port 8080)
#   - PRM (custom /v1/score endpoint, port 8400)

healthCheckTimeout: 900  # AriaUI 25B MoE: ~3min cached, ~12min first download (12 shards x ~50s each)
logLevel: info
logToStdout: both  # Show backend stdout/stderr in container logs
startPort: 5800

models:
  # --- AriaUI: 25B MoE VLM for element grounding ---
  # Used by healing system (aria_ui_client.py -> /v1/chat/completions)
  Aria-UI/Aria-UI-base:
    cmd: >
      /opt/venvs/aria-ui/bin/python3 /opt/backends/aria-ui/serve.py
      --model Aria-UI/Aria-UI-base
      --host 127.0.0.1
      --port ${PORT}
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    ttl: 300
    aliases:
      - aria-ui-base

  Aria-UI/Aria-UI-context-aware:
    cmd: >
      /opt/venvs/aria-ui/bin/python3 /opt/backends/aria-ui/serve.py
      --model Aria-UI/Aria-UI-context-aware
      --host 127.0.0.1
      --port ${PORT}
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    ttl: 300
    aliases:
      - aria-ui-context

  # --- UI-TARS: Visual grounding for GUI automation ---
  # Used by uitars provider.py VLLMProvider -> /v1/chat/completions
  # Default model size configurable via QONTINUI_UITARS_MODEL_SIZE env var.
  # Each size is a separate llama-swap model entry so only one loads at a time.
  ByteDance-Seed/UI-TARS-2B-SFT:
    cmd: >
      python3 -m vllm.entrypoints.openai.api_server
      --model ByteDance-Seed/UI-TARS-2B-SFT
      --host 127.0.0.1
      --port ${PORT}
      --dtype bfloat16
      --max-model-len 4096
      --trust-remote-code
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    ttl: 300
    aliases:
      - ui-tars-2b

  ByteDance-Seed/UI-TARS-7B-SFT:
    cmd: >
      python3 -m vllm.entrypoints.openai.api_server
      --model ByteDance-Seed/UI-TARS-7B-SFT
      --host 127.0.0.1
      --port ${PORT}
      --dtype bfloat16
      --max-model-len 4096
      --trust-remote-code
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    ttl: 300
    aliases:
      - ui-tars-7b

  # --- UI-TARS 1.5: Qwen2.5-VL based, ExLlamaV3-compatible ---
  # UI-TARS 1.5 uses Qwen2.5-VL architecture which ExLlamaV3 supports natively.
  # When EXL3-quantized weights are available, switch cmd to TabbyAPI for
  # faster inference and lower VRAM (~4GB for 7B EXL3 vs ~14GB bfloat16).
  ByteDance-Seed/UI-TARS-1.5-7B:
    cmd: >
      python3 -m vllm.entrypoints.openai.api_server
      --model ByteDance-Seed/UI-TARS-1.5-7B
      --host 127.0.0.1
      --port ${PORT}
      --dtype bfloat16
      --max-model-len 4096
      --trust-remote-code
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    ttl: 300
    aliases:
      - ui-tars-1.5-7b

  # --- Qontinui Grounding v1: Fine-tuned UI-TARS-1.5-7B for element grounding ---
  # LoRA-merged checkpoint from the component-render synthetic grounding pipeline.
  # Qwen2.5-VL architecture, trained on isolated component renders for precise
  # element localization. Served from a local bind-mounted path.
  qontinui-grounding-v1:
    cmd: >
      python3 -m vllm.entrypoints.openai.api_server
      --model /models/qontinui-grounding-v1
      --served-model-name qontinui-grounding-v1
      --host 127.0.0.1
      --port ${PORT}
      --dtype bfloat16
      --max-model-len 8192
      --trust-remote-code
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    ttl: 300
    aliases:
      - qontinui-grounding
      - grounding-v1

  # --- Qontinui Grounding v5: Balanced web + runner + iso training set ---
  # LoRA-merged checkpoint, 2,504 samples (runner/web/iso balanced), 1 epoch,
  # train loss 0.4153, eval loss 0.2407. Successor to v1's isolated-only set.
  qontinui-grounding-v5:
    cmd: >
      python3 -m vllm.entrypoints.openai.api_server
      --model /models/qontinui-grounding-v5
      --served-model-name qontinui-grounding-v5
      --host 127.0.0.1
      --port ${PORT}
      --dtype bfloat16
      --max-model-len 8192
      --trust-remote-code
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    ttl: 300
    aliases:
      - grounding-v5

  # Placeholder for v6 — uncomment once the v6 merged model lands at
  # /models/qontinui-grounding-v6. Retrain trigger: per-domain >=200 corrections
  # OR aggregate >=500; ship gate: beats v5 by >=5pp Acc@center on EVERY
  # per-domain held-out split (see plan section 13).
  # qontinui-grounding-v6:
  #   cmd: >
  #     python3 -m vllm.entrypoints.openai.api_server
  #     --model /models/qontinui-grounding-v6
  #     --served-model-name qontinui-grounding-v6
  #     --host 127.0.0.1
  #     --port ${PORT}
  #     --dtype bfloat16
  #     --max-model-len 8192
  #     --trust-remote-code
  #   proxy: "http://127.0.0.1:${PORT}"
  #   checkEndpoint: /health
  #   ttl: 300
  #   aliases:
  #     - grounding-v6

  # --- PaddleOCR: classical OCR engine wrapped in an OpenAI-compatible shim ---
  # The qontinui-runner's OcrClient (Phase 4 of the UI Bridge Vision Pipeline)
  # POSTs to /v1/chat/completions with an image_url + an OCR prompt, expecting
  # the response's message.content to be a JSON array of {bbox, text, confidence}.
  # PaddleOCR isn't a chat model, so docker/paddleocr/serve.py wraps it with a
  # FastAPI façade that satisfies the contract. CPU-only by default; build a
  # GPU variant by switching the Dockerfile to paddlepaddle-gpu pinned to the
  # host CUDA before re-running docker compose build.
  paddleocr:
    cmd: >
      /opt/venvs/paddleocr/bin/python3 /opt/backends/paddleocr/serve.py
      --host 127.0.0.1
      --port ${PORT}
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    ttl: 300
    aliases:
      - paddle-ocr
      - ocr

  # --- CUA World State Model: 7B VLM judge for action verification ---
  # SEAgent's verifier; Qwen2.5-VL-7B-Instruct fine-tune.
  # Consumed by qontinui-runner's WorldStateVerifier via /v1/chat/completions.
  # Sends TWO images per call (pre/post), hence image=2.
  Zery/CUA_World_State_Model:
    cmd: >
      python3 -m vllm.entrypoints.openai.api_server
      --model Zery/CUA_World_State_Model
      --host 127.0.0.1
      --port ${PORT}
      --dtype bfloat16
      --max-model-len 8192
      --limit-mm-per-prompt '{"image":2}'
      --trust-remote-code
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    ttl: 300
    aliases:
      - cua-wsm
      - world-state-verifier

  # --- Local LLM candidates (GGUF, llama.cpp llama-server) ---
  # Evaluation entries for plan 2026-10-07-measure-which-ai-work-a-local-model-
  # on-spaceships-5090-can-take-over (qontinui-dev-notes). Each exposes the
  # OpenAI-compatible /v1/chat/completions (and llama.cpp's native routes,
  # reachable through llama-swap's /upstream/<model>/... passthrough — the
  # scripted-output emitter's raw /completion uses that). Exclusive swap like
  # every other entry: a vision request unloads a resident LLM and vice versa.
  #
  # Weights are NOT baked into the image. Download each GGUF once into the
  # host directory mounted at /models (LLAMA_SWAP_MODELS), under gguf/ — see
  # README.md "Local LLM candidates" for the exact files and URLs.
  #
  # --jinja makes llama-server render the chat template embedded in the GGUF.
  # Gemma 4's template is the one the 2026-04-22 spike saw return empty
  # message.content on /v1/chat/completions; whether --jinja on this llama.cpp
  # build fixes it is verified on the box (plan Phase 1), not assumed here.
  gemma-4-26b-a4b:
    cmd: >
      /usr/local/bin/llama-server
      -m /models/gguf/gemma-4-26B-A4B-it-UD-Q6_K.gguf
      --host 127.0.0.1
      --port ${PORT}
      --n-gpu-layers 999
      --ctx-size 16384
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --alias gemma-4-26b-a4b
      --no-warmup
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    ttl: 300
    aliases:
      - gemma-4

  qwen3-coder-30b-a3b:
    cmd: >
      /usr/local/bin/llama-server
      -m /models/gguf/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
      --host 127.0.0.1
      --port ${PORT}
      --n-gpu-layers 999
      --ctx-size 32768
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --alias qwen3-coder-30b-a3b
      --no-warmup
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    ttl: 300
    aliases:
      - qwen3-coder

  gpt-oss-20b:
    cmd: >
      /usr/local/bin/llama-server
      -m /models/gguf/gpt-oss-20b-MXFP4.gguf
      --host 127.0.0.1
      --port ${PORT}
      --n-gpu-layers 999
      --ctx-size 32768
      --jinja
      --alias gpt-oss-20b
      --no-warmup
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    ttl: 300
    aliases:
      - gpt-oss

  # --- Image generation: the qontinui image facade (docker/imagegen) ---
  # Plan 2026-10-13-image-generation-and-visual-judgment, Phase 10 (qontinui-dev-notes). ONE
  # entry for every image alias (D1.1: one GPU owner, never a second GPU service): the facade
  # is FastAPI over diffusers and the named post runners, holds one pipeline at a time, and
  # picks the recipe from the alias in the request -- llama-swap forwards it unchanged, in
  # the JSON body of /v1/images/generations and in the multipart form of /v1/images/edits,
  # because useModelName is unset. The alias list must equal docker/imagegen/facade.yaml's
  # `aliases` (tests/test_facade_config.py checks it).
  #
  # Admission lives in the facade, not here: one job on the card, at most one interactive
  # request waiting, bulk work refused `busy`/`deferred` with Retry-After (see
  # qontinui_imagegen/admission.py for why a deeper queue would hold the whole card).
  # concurrencyLimit is set above the facade's own bound (1 running + 1 waiting) so the
  # facade's typed refusals answer first; llama-swap's own limit answers a plain-text 429
  # "Too many requests" at v217 (proxy/process.go), which clients must not mistake for
  # `deferred` -- they branch on error.type.
  #
  # Timeouts: at v217 the first request after llama-swap swaps this entry in is proxied
  # while the process group's lock is held, so a concurrent image request waits inside
  # llama-swap (no typed `busy`) until it ends; clients size timeouts for cold load + the
  # facade's 120 s compute cap (README "Image generation").
  #
  # No group configuration: Phase 0 measured at v217 that a swap does not kill a held
  # request or an SSE stream (rule R-swap PASS) -- Process.Stop() waits for in-flight
  # requests. Never mark this entry persistent: it would pin tens of GB against every alias.
  #
  # metadata: v217 has no per-model `capabilities`; /v1/models serves this map under
  # meta.llamaswap, which is what Phase 25's svc:imagegen probe keys on.
  #
  # QONTINUI_IMAGEGEN (the machine switch, plan Phase 12 step 4) reaches the facade through
  # llama-swap's own environment (children inherit it; docker-compose.yml passes it through).
  # So does QONTINUI_IMAGEGEN_LISTENER: the facade serves only when the deployment attests a
  # loopback-only listener (rule R-bind; README "Image generation"), and the tracked compose
  # file, which publishes 0.0.0.0:8100, deliberately does not attest one.
  qontinui-imagegen:
    cmd: >
      /opt/venvs/imagegen/bin/python3 -m qontinui_imagegen.serve
      --host 127.0.0.1
      --port ${PORT}
    env:
      - PYTHONPATH=/opt/imagegen
      - HF_HUB_OFFLINE=1
      - QONTINUI_IMAGEGEN_WEIGHTS_ROOT=/weights/imagegen
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    ttl: 300
    concurrencyLimit: 16
    metadata:
      qontinui_capability: image_generation
    aliases:
      - qwen-image-2512
      - qwen-image-edit-2511
      - z-image-turbo
      - flux-1-schnell
      - real-esrgan-x2plus
      - real-esrgan-general-x4v3

# AriaUI variants are mutually exclusive (same architecture, different weights).
# UI-TARS sizes are mutually exclusive (only one loaded at a time).
# Default swap behavior: loading one model unloads any other.
#
# To co-load AriaUI + UI-TARS-2B simultaneously (requires ~17GB VRAM):
# Uncomment the groups section below:
#
# groups:
#   coload:
#     swap: false
#     exclusive: true
#     members:
#       - Aria-UI/Aria-UI-base
#       - ByteDance-Seed/UI-TARS-2B-SFT
