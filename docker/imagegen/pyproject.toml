# The image provider's own test environment (plan Phase 10, Gate).
#
# docker/imagegen runs in the llama-swap image's own facade venv -- a uv-managed CPython 3.12,
# not the image's system python3 (3.10) and not qontinui's library environment -- and its
# facade needs FastAPI, which the library's poetry env does not carry. So it has its own
# project, its own lock and its own CI job (`imagegen` in .github/workflows/ci.yml, mirrored
# in .qontinui/ci.toml), on Python 3.12 like the image (manifest.yaml `target`). The versions
# of fastapi, starlette, uvicorn and python-multipart are the manifest's pins
# (manifest.yaml, "facade runtime"); tests/test_facade_config.py checks the runtime lock
# agrees with them. The facade's GPU runtime (torch, diffusers, ...) is NOT installed here:
# the tests run against a fake pipeline executor. It is installed in the image from the
# hash-locked requirements-runtime.txt.

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "0.142.2"
starlette = "1.7.0"
uvicorn = "0.54.0"
python-multipart = "0.0.32"
pillow = "^13"
pyyaml = "^6.0"
httpx = "^0.28"
pytest = "^9.0"
pytest-timeout = "^2.3"
# The facade tests read wheel tags with it (tests/test_facade_config.py).
packaging = "^26.3"
tzdata = "*"
# Advisory floor (GHSA-6q48-6c7w-9gw2, fixed in 2026.10.18) on a package httpx pulls in;
# requirements-runtime.in carries the same floor for the image.
certifi = ">=2026.10.18"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# A test that hangs (an admission bug leaves a request waiting forever) fails at 60 s
# instead of holding the CI job until its own timeout.
timeout = 60
addopts = ["-ra", "--strict-markers"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
