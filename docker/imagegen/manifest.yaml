# Licence manifest for the local image provider -- decision record D2,
# decision_record/image-generation-weights-are-permissively-licensed (a5ec7670), in data.
#
# Every component the provider loads carries its SPDX licence beside its pinned sha256s;
# docker/imagegen/tests/test_manifest.py refuses a non-admitted licence, a component D2
# excludes by name, an unpinned file or revision, vendored code whose bytes drift, and any
# recipe that could fetch from the network. The admitted families live in
# qontinui_imagegen/manifest.py (ADMITTED_SPDX), never here.
#
# Every fact below was read on 2026-10-13 from the source it names: Hugging Face's tree API
# at the pinned revision (lfs.oid / lfs.size for LFS files; small files downloaded,
# checked against their git blob id, then hashed), GitHub at the pinned commit, PyPI's JSON
# API and the PyTorch cu128 index. licence_read_at is the time the licence text in
# licence_evidence was read; re-read it at every upgrade (D2: a licence is a property of a
# version). To add or upgrade a component: read its licence text and pin its files the same
# way, then run `python -m qontinui_imagegen.manifest` from docker/imagegen.
#
# Sizing (Phase 0 item 3, Phase 10 deploy step 1): use `python -m qontinui_imagegen.manifest
# --footprint [ids]`, which counts each sha256 once. Qwen-Image-2512 and Qwen-Image-Edit-2511
# list the same text encoder, VAE and tokenizer files under the same sha256s; those bytes
# are stored once.

schema_version: 1
decision_record:
  name: image-generation-weights-are-permissively-licensed
  id: a5ec7670-843b-4556-ab52-7f5f7662ee09
  version: 1

# The packaging the pinned wheels target: Phase 10's Docker arm (the llama-swap image,
# Ubuntu 22.04 python3). If Phase 0 item 9 picks native Windows (rule R-mem), that arm adds
# its win_amd64 wheels at the interpreter it measures; an unpinned platform fails closed.
target:
  os: linux
  arch: x86_64
  python: "3.10"
  cuda: "12.8"

# The runtime contract the facade applies to every load (plan Phase 2 step 4, Phase 10).
runtime:
  env:
    HF_HUB_OFFLINE: "1"
  from_pretrained:
    local_files_only: true
    trust_remote_code: false
  torch_load:
    weights_only: true

scope: >-
  D2's component scope, enumerated below and checked by test: the weights the provider
  loads (kind model), the model code it executes from this repository (kind
  vendored_code), and the libraries that define or run model computation (kind library):
  diffusers, transformers, accelerate, safetensors and torch; torchvision, timm, kornia
  and einops, which the vendored model code imports for its layers; and vtracer. Not
  enumerated here: general-purpose runtime dependencies those libraries and the vendored
  code pull in (numpy, Pillow, OpenCV, huggingface-hub, tokenizers, triton and the rest
  of the facade's lockfile, which Phase 10 creates) -- this manifest does not vouch for
  their licences. The NVIDIA driver and CUDA runtime are platform, below.

platform:
  outside_d2_scope: true
  reason: >-
    The GPU driver and the CUDA runtime are the platform the components run on, under
    NVIDIA's own licence terms. They are named here so the boundary of D2's component
    scope is stated rather than silent.
  components:
    - name: NVIDIA GPU driver
      version: measured by Phase 0 item 2 (nvidia-smi on Windows, in WSL and in a container)
    - name: NVIDIA CUDA runtime wheels that torch 2.11.0+cu128 requires on Linux
      version: >-
        cuda-toolkit[cublas,cudart,cufft,cufile,cupti,curand,cusolver,cusparse,nvjitlink,nvrtc,nvtx]==12.8.1;
        cuda-bindings>=12.9.4,<13; nvidia-cudnn-cu12==9.19.0.56; nvidia-cusparselt-cu12==0.7.1;
        nvidia-nccl-cu12==2.28.9; nvidia-nvshmem-cu12==3.4.5
      source: Requires-Dist of torch-2.11.0+cu128-cp310-cp310-manylinux_2_28_x86_64.whl, read 2026-10-13

vendor_dir: vendor

