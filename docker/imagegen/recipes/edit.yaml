# Recipe: an instruction edit of one or more reference images. Model ids resolve in
# ../manifest.yaml. Load precision is chosen by Phase 0 item 5 and lands here as a new
# recipe version.
id: edit
version: 1
description: >-
  Instruction edit of one or more reference images with Qwen-Image-Edit-2511. Height and
  width are left to the pipeline, which renders at a 1024x1024 area in the last input
  image's aspect ratio (diffusers 0.41.0 QwenImageEditPlusPipeline, calculate_dimensions).
pipeline: QwenImageEditPlusPipeline
models: [qwen-image-edit-2511]
parameters:
  # Model card at revision 6f3ccc0b ("Quick Start"): 40 steps, true_cfg_scale 4.0,
  # guidance_scale 1.0, a single-space negative prompt.
  num_inference_steps: 40
  true_cfg_scale: 4.0
  guidance_scale: 1.0
  negative_prompt: " "
  max_sequence_length: 512  # QwenImageEditPlusPipeline's default (diffusers 0.41.0)
  scheduler: {class: FlowMatchEulerDiscreteScheduler, config: model_default}
  size: from_inputs
post: []
seed_policy:
  mode: seeded
  base: request_or_random
  per_candidate: add_index
